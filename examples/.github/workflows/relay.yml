name: relay

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the relay reads only run and PR metadata and never checks out code
    workflows: [ci]
    types: [completed]
  check_run: # zizmor: ignore[dangerous-triggers] the relay reads only check and PR metadata and never checks out code
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  relay:
    permissions:
      actions: read
      pull-requests: write
    uses: lcnascimento/gh-workflows/.github/workflows/relay.yml@5e115b1da30b70099a34a0f78850bf100a031043 # v1.1.0
    with:
      bot-login: homelab-cyrus[bot]
      reviewer-login: greptile-apps[bot]
