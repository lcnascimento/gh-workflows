name: relay

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the relay reads only run and PR metadata and never checks out code
    workflows: [ci]
    types: [completed]
  check_run: # zizmor: ignore[dangerous-triggers] the relay reads only check and PR metadata and never checks out code
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  relay:
    permissions:
      actions: read
      pull-requests: write
    uses: lcnascimento/gh-workflows/.github/workflows/relay.yml@cc74614022fd8ce98a481110dc9bf6dc50050777 # v2.0.0
    with:
      bot-login: homelab-cyrus[bot]
      reviewer-logins: |
        greptile-apps[bot]
