name: ci-failure

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] reads only the run metadata, never checks out the PR code
    workflows: [ci]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}

jobs:
  mention:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: lcnascimento/gh-workflows/actions/ci-failure-comment@246fafe99856b3c825561e952180e7c226223374 # v1.3.0
        with:
          bot: homelab-cyrus[bot]
