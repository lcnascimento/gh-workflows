name: sonarqube

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label, e.g. ubuntu-latest while the homelab-prod runner is down
        type: string
        default: ubuntu-latest

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarqube:
    permissions:
      contents: read
    uses: lcnascimento/gh-workflows/.github/workflows/sonarqube.yml@246fafe99856b3c825561e952180e7c226223374 # v1.3.0
    with:
      runner: ${{ inputs.runner }}
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
