name: ci-failure-comment
description: Mention a bot on the pull request whose CI failed, once per commit, from a workflow_run event

inputs:
  bot:
    description: Login of the bot to mention, e.g. homelab-cyrus[bot]
    required: true
  max-attempts:
    description: Maximum number of failure reports per pull request
    default: "3"
  token:
    description: Token used to read pull requests and comment on them. The calling job must grant `pull-requests write`.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        BOT: ${{ inputs.bot }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      run: "$GITHUB_ACTION_PATH/ci-failure-comment.sh"
