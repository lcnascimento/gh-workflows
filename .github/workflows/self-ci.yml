name: self-ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/lint-workflows

  test-lint-workflows:
    permissions:
      contents: read
    uses: ./.github/workflows/test-lint-workflows.yml

  test-ci:
    permissions:
      contents: read
    uses: ./.github/workflows/test-ci.yml
