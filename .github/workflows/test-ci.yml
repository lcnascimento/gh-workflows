name: test-ci

on:
  workflow_call:

permissions: {}

jobs:
  clean:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: testdata/ci/clean

  runner-input:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: testdata/ci/clean
      runner: ubuntu-24.04-arm

  assert-runner:
    needs: [clean, runner-input]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CI_RUNNER: ${{ vars.CI_RUNNER }}
          FROM_VARS: ${{ needs.clean.outputs.runner }}
          FROM_INPUT: ${{ needs.runner-input.outputs.runner }}
        run: |
          expected="${CI_RUNNER:-ubuntu-latest}"
          echo "vars.CI_RUNNER='$CI_RUNNER' no-input=$FROM_VARS input=$FROM_INPUT"
          test "$FROM_VARS" = "$expected"
          test "$FROM_INPUT" = ubuntu-24.04-arm
