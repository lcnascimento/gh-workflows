name: relay

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label; falls back to vars.CI_RUNNER, then ubuntu-latest
        type: string
        default: ''
      bot-login:
        description: Login of the bot whose pull requests are relayed, e.g. homelab-cyrus[bot]
        type: string
        required: true
      max-iterations:
        description: Maximum number of automatic reports per pull request
        type: number
        default: 3

permissions: {}

jobs:
  relay:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
      || github.event_name == 'check_run' && github.event.check_run.name == 'SonarQube Code Analysis' && github.event.check_run.conclusion == 'failure'
      || github.event_name != 'workflow_run' && github.event_name != 'check_run'
    concurrency:
      group: ${{ github.workflow }}-relay-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha || github.run_id }}
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: $/actions/ci-failure-comment
        with:
          bot: ${{ inputs.bot-login }}
          author: ${{ inputs.bot-login }}
          max-attempts: ${{ inputs.max-iterations }}
