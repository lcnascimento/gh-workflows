name: test-sonarqube

on:
  workflow_call:

permissions: {}

jobs:
  go:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: testdata/ci/levels
      sonar: false

  typescript:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: testdata/ci/typescript
      sonar: false

  python:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: testdata/ci/python
      sonar: false

  hcl:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: testdata/ci/hcl
      sonar: false

  assert-skipped:
    needs: [go, typescript, python, hcl]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          jobs=$(gh api --paginate "$RUN" --jq '.jobs[] | {name, conclusion}' | jq -s .)
          status=0
          for caller in go typescript python hcl; do
            got=$(jq -r --arg n "$caller / sonarqube" '[.[] | select(.name == $n or (.name | endswith(" / " + $n))) | .conclusion] | unique | join(",")' <<<"$jobs")
            echo "$caller / sonarqube: want skipped got $got"
            [[ "$got" == skipped ]] || status=1
          done
          exit "$status"

  args:
    needs: [go, typescript, python, hcl]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: go
        uses: ./actions/sonar-args
        with:
          coverage-artifact: ${{ needs.go.outputs.coverage-artifact }}
          pull-request-sha: 0123456789abcdef0123456789abcdef01234567
      - id: typescript
        uses: ./actions/sonar-args
        with:
          coverage-artifact: ${{ needs.typescript.outputs.coverage-artifact }}
          project-key: homelab-typescript
          ref-name: main
      - id: python
        uses: ./actions/sonar-args
        with:
          coverage-artifact: ${{ needs.python.outputs.coverage-artifact }}
          ref-name: feature
      - id: hcl
        uses: ./actions/sonar-args
        with:
          coverage-artifact: ${{ needs.hcl.outputs.coverage-artifact }}
          pull-request-sha: fedcba9876543210fedcba9876543210fedcba98
          project-key: homelab-hcl
      - env:
          GO: ${{ steps.go.outputs.args }}
          GO_ARTIFACT: ${{ needs.go.outputs.coverage-artifact }}
          TYPESCRIPT: ${{ steps.typescript.outputs.args }}
          TYPESCRIPT_ARTIFACT: ${{ needs.typescript.outputs.coverage-artifact }}
          PYTHON: ${{ steps.python.outputs.args }}
          PYTHON_ARTIFACT: ${{ needs.python.outputs.coverage-artifact }}
          HCL: ${{ steps.hcl.outputs.args }}
          GO_KEY: ${{ steps.go.outputs.project-key }}
          TYPESCRIPT_KEY: ${{ steps.typescript.outputs.project-key }}
        run: |
          status=0
          check() {
            echo "$1:"
            echo "  want: $3"
            echo "  got:  $2"
            [[ "$2" == "$3" ]] || status=1
          }
          go_dir="$RUNNER_TEMP/sonar-coverage/$GO_ARTIFACT/$GO_ARTIFACT"
          ts_dir="$RUNNER_TEMP/sonar-coverage/$TYPESCRIPT_ARTIFACT"
          py_dir="$RUNNER_TEMP/sonar-coverage/$PYTHON_ARTIFACT"
          check "pull request, default key, Go levels" "$GO" "-Dsonar.projectKey=gh-workflows -Dsonar.scm.revision=0123456789abcdef0123456789abcdef01234567 -Dsonar.go.coverage.reportPaths=$go_dir-e2e/e2e.out,$go_dir-integration/integration.out,$go_dir-unit/unit.out"
          check "main, key override, lcov" "$TYPESCRIPT" "-Dsonar.projectKey=homelab-typescript -Dsonar.qualitygate.wait=true -Dsonar.javascript.lcov.reportPaths=$ts_dir/unit.lcov"
          check "other branch, Cobertura" "$PYTHON" "-Dsonar.projectKey=gh-workflows -Dsonar.python.coverage.reportPaths=$py_dir/unit.xml"
          check "pull request, no coverage" "$HCL" "-Dsonar.projectKey=homelab-hcl -Dsonar.scm.revision=fedcba9876543210fedcba9876543210fedcba98"
          check "project-key output, default" "$GO_KEY" gh-workflows
          check "project-key output, override" "$TYPESCRIPT_KEY" homelab-typescript
          exit "$status"
